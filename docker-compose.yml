version: "3.9"

services:
  db:
    image: postgres:16-alpine
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-goldensunlight_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida majburiy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY .env faylida majburiy}
      - DJANGO_DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-goldensunlight_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env faylida majburiy}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS .env faylida majburiy}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS .env faylida majburiy}
      # Ixtiyoriy — admin support panelidagi "AI taklif" tugmasi uchun. Bo'sh
      # qoldirilsa (.env'da yo'q bo'lsa) shu funksiya o'chiq turadi.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: ./backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY .env faylida majburiy}
      - DJANGO_DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-goldensunlight_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env faylida majburiy}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS .env faylida majburiy}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS .env faylida majburiy}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: ./backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY .env faylida majburiy}
      - DJANGO_DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-goldensunlight_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env faylida majburiy}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS .env faylida majburiy}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS .env faylida majburiy}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_MEDIA_ORIGIN=
        - NEXT_PUBLIC_SITE_URL=${SITE_URL:?SITE_URL .env faylida majburiy}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    expose:
      - "3000"
    environment:
      # Brauzerga yuboriladi (nisbiy, nginx orqali)
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_MEDIA_ORIGIN=
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:?SITE_URL .env faylida majburiy}
      # Faqat server (RSC) uchun — konteyner ichida nginx'ni aylanib o'tib
      # to'g'ridan-to'g'ri backend'ga boradi (nisbiy URL serverda ishlamaydi)
      - API_URL_INTERNAL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
