# Brings up every service (db, redis, backend, celery, frontend, nginx) on a single
# VPS with one `docker compose up -d` — no need for 4 separate paid resources like on
# Render (~$7/mo x 4), one cheap server is enough.
#
# `celery-beat` is deliberately left out: there's no periodic/scheduled task in the
# project. The `celery` worker itself IS needed — email verification codes
# (backend/users/tasks.py) are sent via `.delay()`, which only actually runs once a
# worker consumes it from Redis (CELERY_TASK_ALWAYS_EAGER is only on when DEBUG=True,
# see backend/config/settings.py).

services:
  db:
    image: postgres:16-alpine
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-goldensunlight_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida majburiy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY .env faylida majburiy}
      - DJANGO_DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-goldensunlight_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env faylida majburiy}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS .env faylida majburiy}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS .env faylida majburiy}
      # Ixtiyoriy — admin support panelidagi "AI taklif" tugmasi uchun. Bo'sh
      # qoldirilsa (.env'da yo'q bo'lsa) shu funksiya o'chiq turadi.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Ixtiyoriy — bo'sh qoldirilsa email tasdiqlash kodi (users/tasks.py) haqiqatan
      # yuborilmaydi, `celery` konteyneri logiga chiqariladi xolos.
      - EMAIL_HOST=${EMAIL_HOST:-smtp.mail.ru}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-True}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: ./backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A config worker -l info --concurrency=2
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY .env faylida majburiy}
      - DJANGO_DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-goldensunlight_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env faylida majburiy}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS .env faylida majburiy}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS .env faylida majburiy}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.mail.ru}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-True}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_MEDIA_ORIGIN=
        - NEXT_PUBLIC_SITE_URL=${SITE_URL:?SITE_URL .env faylida majburiy}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    expose:
      - "3000"
    environment:
      # Brauzerga yuboriladi (nisbiy, nginx orqali)
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_MEDIA_ORIGIN=
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:?SITE_URL .env faylida majburiy}
      # Faqat server (RSC) uchun — konteyner ichida nginx'ni aylanib o'tib
      # to'g'ridan-to'g'ri backend'ga boradi (nisbiy URL serverda ishlamaydi)
      - API_URL_INTERNAL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # Reloads nginx every 6h in the background so it picks up certificates renewed
    # by the `certbot` service, without needing a custom image just for that.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Renews the Let's Encrypt certificate via the webroot challenge (served by nginx
  # above at /.well-known/acme-challenge/). Getting the FIRST certificate is a
  # separate, one-time manual step — see the HTTPS bootstrap instructions in
  # CLAUDE.md — because nginx can't start with its 443 block until a certificate
  # already exists on the certbot_conf volume.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
  certbot_conf:
  certbot_www:
