[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; entrypoint.sh prepares the Postgres data directory before this starts — this is
; the actual long-running `postgres` server process.
[program:postgres]
command=/bin/sh -c 'exec "$(find /usr/lib/postgresql -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)/bin/postgres" -D /data/postgres -c listen_addresses=localhost'
user=postgres
autostart=true
autorestart=true
priority=10
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Used as cache and as the Celery broker (backend/config/settings.py) for the
; `celery` program below. RDB persistence (--save) is disabled since losing queued
; tasks on restart is an acceptable tradeoff here (nothing but the verification
; email task uses it, and it isn't scheduled/periodic).
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --daemonize no
user=redis
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Waits for Postgres to accept connections, then migrate/collectstatic/bootstrap/seed
; — the same sequence as backend/render-start.sh (the old, separate-services Render
; setup).
[program:backend]
directory=/app/backend
command=/bin/sh -c '
  until pg_isready -h localhost -U "%(ENV_DB_USER)s" >/dev/null 2>&1; do sleep 1; done;
  python manage.py migrate --noinput &&
  python manage.py collectstatic --noinput &&
  (python render_bootstrap_admin.py || true) &&
  (python seed.py || true) &&
  exec gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 1 --threads 4 --timeout 120 --max-requests 300 --max-requests-jitter 50
  '
autostart=true
autorestart=true
priority=20
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Processes `.delay()` calls — currently just the email verification task
; (backend/users/tasks.py). Without this running, verification codes are generated
; but the email is never actually sent (CELERY_TASK_ALWAYS_EAGER is only on when
; DEBUG=True).
[program:celery]
directory=/app/backend
command=/bin/sh -c '
  until redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1; do sleep 1; done;
  until pg_isready -h localhost -U "%(ENV_DB_USER)s" >/dev/null 2>&1; do sleep 1; done;
  exec celery -A config worker -l info --concurrency=2
  '
autostart=true
autorestart=true
priority=25
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
directory=/app/frontend
command=node server.js
environment=PORT="3000",HOSTNAME="0.0.0.0"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
