# Render.com Blueprint — shu bitta fayl orqali kerakli barcha resurslar (DB, Redis,
# backend, frontend) bitta "New > Blueprint" oqimida yaratiladi.
#
# 1 OYLIK BEPUL SINOV uchun mo'ljallangan — barcha resurs "free" rejada:
#   - Postgres (free): 30 kundan keyin AVTOMATIK O'CHIRILADI — aynan "1 oy sinov" muddatiga
#     mos keladi. 30 kundan keyin ham davom ettirish kerak bo'lsa, muddat tugashidan oldin
#     Render dashboard'da bazani pullik rejaga o'tkazish kerak (aks holda ma'lumot yo'qoladi).
#   - Redis/Key Value (free): faqat Django cache uchun ishlatiladi. Loyihada hozircha
#     birorta ham haqiqiy Celery task yo'q (config/celery.py bor, lekin @shared_task
#     ishlatilmagan) — shuning uchun celery worker/beat servislari BU BLUEPRINT'GA ATAYLAB
#     QO'SHILMAGAN (ular Render'da bepul emas, ~$7/oy'dan boshlanadi). Kelajakda haqiqiy
#     background task qo'shilsa, shu faylga alohida `worker` turidagi servis qo'shiladi.
#   - Web servislar (free): 15 daqiqa so'rovsiz qolsa "uxlaydi", keyingi so'rovda ~30-60s
#     ichida qayta uyg'onadi (bepul rejaning tabiiy cheklovi — sinov uchun muhim emas).
#   - Bepul web servisda DOIMIY DISK YO'Q — /app/media konteyner qayta ko'tarilganda
#     tozalanadi. Shuning uchun pastdagi dockerCommand har safar ishga tushganda
#     `seed.py`ni ham qayta ishga tushiradi: demo mahsulot/galereya rasmlari reponing
#     o'zidan (backend/seed_assets kabi manbadan) nusxalanadi, shuning uchun ular har safar
#     tiklanadi. LEKIN sinov davomida admin panel orqali yuklangan YANGI rasmlar (yangi
#     mahsulot fotosi, avatar, yangilik rasmi va h.k.) servis uxlab-uyg'ongandan yoki qayta
#     deploy qilingandan keyin yo'qoladi — bu haqiqiy production emas, faqat sinov ekanini
#     unutmang. Doimiy saqlash kerak bo'lsa backend'ni "Starter" rejaga o'tkazib disk
#     qo'shish kerak bo'ladi.
#
# DIQQAT: quyidagi servis nomlari (goldensunlight-backend / goldensunlight-frontend)
# Render'ning umumiy onrender.com domenida GLOBAL NOYOB bo'lishi kerak. Agar deploy vaqtida
# "nom band" desa, nomni o'zgartiring VA pastdagi ALLOWED_HOSTS / CORS_ALLOWED_ORIGINS /
# NEXT_PUBLIC_* qiymatlaridagi mos URL'larni ham xuddi shu nomga yangilang (keyin frontend
# uchun "Clear build cache & Deploy" qiling — NEXT_PUBLIC_* build vaqtida bundle'ga yoziladi).

databases:
  - name: goldensunlight-db
    plan: free
    region: frankfurt
    databaseName: goldensunlight_db
    user: goldensunlight

services:
  - type: keyvalue
    name: goldensunlight-redis
    plan: free
    region: frankfurt

  - type: web
    name: goldensunlight-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    rootDir: backend
    healthCheckPath: /api/schema/
    dockerCommand: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && (python manage.py createsuperuser --noinput || true) && python seed.py && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 120"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_HOST
        fromDatabase:
          name: goldensunlight-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: goldensunlight-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: goldensunlight-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: goldensunlight-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: goldensunlight-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: goldensunlight-redis
          property: connectionString
      # Frontend servisining haqiqiy domeni (pastda) bilan bir xil bo'lishi shart.
      - key: ALLOWED_HOSTS
        value: goldensunlight-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://goldensunlight-frontend.onrender.com
      # Birinchi superadmin'ni bootstrap qilish uchun (Render bepul rejada shell yo'q,
      # shuning uchun createsuperuser'ni --noinput bilan avtomatik ishga tushiramiz).
      # Keyingi qayta ishga tushishlarda user allaqachon mavjud bo'lgani uchun xato
      # chiqadi, lekin `|| true` uni yutib yuboradi va gunicorn baribir ishga tushadi.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: goldensunlight-frontend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    rootDir: frontend
    envVars:
      # Bularning barchasi `next build` vaqtida client bundle'ga yoziladi (frontend/Dockerfile
      # ARG'lari) — shuning uchun mutlaq (https://...) bo'lishi shart, "/api" emas (nginx
      # yo'q, backend va frontend alohida domenda).
      - key: NEXT_PUBLIC_API_URL
        value: https://goldensunlight-backend.onrender.com/api
      - key: NEXT_PUBLIC_MEDIA_ORIGIN
        value: https://goldensunlight-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://goldensunlight-frontend.onrender.com
      - key: API_URL_INTERNAL
        value: https://goldensunlight-backend.onrender.com/api
